name: go-libs
summary: |-
  Public shared Go utility library for Trust Wallet backend services — infrastructure helpers (HTTP, caching, DB, messaging, metrics, workers, crypto).

  Route here for: anything about the go-libs packages themselves — cache/redis, client (HTTP + JSON-RPC), database (GORM/Postgres, migrations), metrics (Prometheus), middleware (Gin), mq (RabbitMQ/AMQP), worker (periodic background jobs), testy (integration test helpers), crypto (AES/ECDSA), logging, gin, health, slice, set, ctask, nullable, eventer, httplib. Adding, modifying, or debugging any of these packages belongs here.

  Do NOT route here for: domain-specific business logic or crypto primitives (those belong in go-primitives); the backend microservices that consume go-libs (separate private repos); wallet-core or mobile code; blockchain-specific coin types or addresses.

  Consumers: Trust Wallet Go backend microservices that import github.com/trustwallet/go-libs (private repos, multiple teams); any public Go project that adopts these utilities.

  Ships: Go module github.com/trustwallet/go-libs — importable packages (no binaries, no CLI, no HTTP service).

  Agent routing: understanding a package → knowledge/features/<package>.md; architecture + god-nodes → knowledge/architecture/; patterns → knowledge/patterns/; security → knowledge/security/; test helpers → knowledge/tests/.
